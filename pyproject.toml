[project]
name = "ssb-klass-python"
version = "1.0.8"
description = "A Python package built on top of KLASS's API for retrieving classifications, codes, correspondences etc."
authors = [
    { name = "Carl Corneil", email = "ssb-pythonistas@ssb.no" },
    { name = "Statistics Norway" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["classifiers"]

dependencies = [
    "python-dateutil >=2.8.2",
    "toml >=0.10.2",
    "ipywidgets >=8.0.6",
    "pandas >=1.5.3",
    "pyarrow >=10.0.1",
    "requests >=2.31.0",
    "ipython <9",
    "typing-extensions >=4.12.2",
]

[project.urls]
homepage = "https://github.com/statisticsnorway/ssb-klass-python"
repository = "https://github.com/statisticsnorway/ssb-klass-python"
documentation = "https://statisticsnorway.github.io/ssb-klass-python"
Changelog = "https://github.com/statisticsnorway/ssb-klass-python/releases"

[dependency-groups]
lint = [
    "black[jupyter]>=25.11.0",
    "pre-commit>=4.4.0",
    "pre-commit-hooks>=6.0.0",
    "pydoclint>=0.8.3",
    "ruff>=0.14.5",
]
doc = [
    "furo>=2025.9.25",
    "myst-parser>=4.0.1",
    "sphinx>=8.1.3",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-autodoc-typehints>=3.0.1",
]
test = [
    "coverage[toml]>=7.11.3",
    "pygments>=2.19.0",
    "pytest>=9.0.0",
    "pytest-cov>=4.0.0",
    "typeguard>=2.13.3",
    "xdoctest[colors]>=1.3.0",
]
typing = [
    "mypy>=1.18.2",
    "pandas-stubs>=2.1.1.230928",
    "types-python-dateutil>=2.8.19.14",
    "types-requests>=2.31.0.10",
    "types-toml>=0.10.8.7",
]
dev = [
    { include-group = "lint" },
    { include-group = "doc" },
    { include-group = "test" },
    { include-group = "typing" },
    "deptry>=0.24.0; python_version < '4.0'",
    "ipykernel>=6.15.3",
    "nox>=2025.2.9",
    "nox-poetry>=1.0.3",
    "pyproject-flake8>=5.0.4.post1",
]

[tool.poetry]
packages = [{ include = "klass", from = "src" }]
classifiers = ["Development Status :: 4 - Beta"]
requires-poetry = ">=2.3"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.9"

[tool.pytest.ini_options]
pythonpath = ["src"]


[tool.coverage.paths]
source = ["src", "*/site-packages"]
tests = ["tests", "*/tests"]

[tool.coverage.run]
branch = true
source = ["klass", "tests"]
relative_files = true

[tool.coverage.report]
show_missing = true
fail_under = 50

[tool.deptry.per_rule_ignores]
DEP001 = ["nox", "nox_poetry"]  # packages available by default

[tool.mypy]
strict = true
warn_unreachable = true
pretty = true
show_column_numbers = true
show_error_context = true
exclude = ["tests", "docs", "noxfile.py"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["ipywidgets.*", "argcomplete.*"]
ignore_missing_imports = true

[tool.ruff]
force-exclude = true     # Apply excludes to pre-commit
show-fixes = true
src = ["src", "tests"]
target-version = "py310" # Minimum Python version supported

include = ["*.py", "*.pyi", "**/pyproject.toml", "*.ipynb"]
extend-exclude = [
    "__pycache__",
    "old",
    ".ipynb_checkpoints",
    "noxfile.py",
    "docs/conf.py",
]

# Ruff rules may be customized as desired: https://docs.astral.sh/ruff/rules/
[tool.ruff.lint]
select = [
    "A",   # prevent using keywords that clobber python builtins
    "ANN", # check type annotations
    "B",   # bugbear: security warnings
    "D",   # documentation
    "E",   # pycodestyle
    "F",   # pyflakes
    "ISC", # implicit string concatenation
    "I",   # sort imports
    "UP",  # alert you when better syntax is available in your python version
    "RUF", # the ruff developer's own rules
]
ignore = [
    "ANN202", # Don't require return type annotation for private functions.
    "ANN401", # Allow type annotation with type Any.
    "D100",   # Supress undocumented-public-module. Only doc of public api required.
    "D107",   # We are of the opinion that inits dont need a docstring, when the class has one...
    "E402",   # Supress module-import-not-at-top-of-file, needed in jupyter notebooks.
    "E501",   # Supress line-too-long warnings: trust black's judgement on this one.
]
external = ["DOC"] # Preserve pydoclint noqa codes.

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pydocstyle]
convention = "google" # You can also use "numpy".

[tool.ruff.lint.pep8-naming]
classmethod-decorators = [
    "classmethod",
    "validator",
    "root_validator",
    "pydantic.validator",
]

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F401"]
"**/tests/*" = [
    "ANN001", # type annotations don't add value for test functions
    "ANN002", # type annotations don't add value for test functions
    "ANN003", # type annotations don't add value for test functions
    "ANN201", # type annotations don't add value for test functions
    "ANN204", # type annotations don't add value for test functions
    "ANN205", # type annotations don't add value for test functions
    "ANN206", # type annotations don't add value for test functions
    "D100",   # docstrings are overkill for test functions
    "D101",
    "D102",
    "D103",
    "D100",
    "S101",   # asserts are encouraged in pytest
]
"demo/*.py" = ["B018"] # Ignore the useless expressions in the notebooks


[tool.pydoclint]
style = "google"
exclude = '\.git|\.nox'
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
allow-init-docstring = true
native-mode-noqa-location = "definition"
quiet = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
